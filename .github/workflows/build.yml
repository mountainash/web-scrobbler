name: Build
on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:
    inputs:
      browser:
        description: 'Browser to build'
        required: true
        default: 'chrome'
        type: choice
        options:
          - chrome
          - firefox
          - safari
jobs:
  build-chrome:
    name: Build the extension for Chrome
    if: github.event_name != 'workflow_dispatch' || inputs.browser == 'chrome'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build the extension
        run: |
          npm run build chrome

      - name: Upload the extension as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: web-scrobbler-chrome
          path: build/chrome

  build-firefox:
    name: Build the extension for Firefox
    if: github.event_name != 'workflow_dispatch' || inputs.browser == 'firefox'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build the extension
        run: |
          npm run build firefox

      - name: Upload the extension as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: web-scrobbler-firefox
          path: build/firefox

  build-safari:
    name: Build the extension for Safari
    if: github.event_name != 'workflow_dispatch' || inputs.browser == 'safari'
    runs-on: macos-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Install Os packages
        run: |
          brew install pango

      - name: Install dependencies
        run: npm ci

      - name: Build the extension
        run: |
          npm run build safari

      - name: Compress the raw Safari extension
        run: |
          cd build
          zip -r safariraw.zip safariraw

      - name: Upload the raw Safari extension as a compressed artifact
        uses: actions/upload-artifact@v7
        with:
          name: web-scrobbler-safari-raw
          path: build/safariraw.zip

      - name: Upload the extension as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: web-scrobbler-safari
          path: build/safari
